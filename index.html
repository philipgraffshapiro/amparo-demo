	color: #222;

:root {
  color-scheme: dark;
  --bg: #171b1a;
  --surface: #1e2321;
  --surface-2: #272d29;
  --surface-3: #303730;
  --text: #efeee7;
  --muted: #afb4aa;
  --faint: #858e82;
  --line: #363e36;
  --accent: #e4bc80;
  --accent-ink: #24281f;
  --accent-soft: #3b3529;
  --shadow: 0 24px 70px #0005;
  --header: 86px;
  --dock-space: 110px;
  --gutter: clamp(28px, 4vw, 72px);
}
:root[data-theme='light'] {
  color-scheme: light;
  --bg: #f2efe7;
  --surface: #faf8f2;
  --surface-2: #e9e6dd;
  --surface-3: #dddcd1;
  --text: #252c24;
  --muted: #61695e;
  --faint: #61695e;
  --line: #d5d8ca;
  --accent: #805625;
  --accent-ink: #24281f;
  --accent-soft: #e9d9be;
  --shadow: 0 24px 70px #2b33281a;
}
* {
  box-sizing: border-box;
}
html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
}
body {
  background: var(--bg);
  color: var(--text);
  font:
    14px/1.5 Manrope,
    Arial,
    sans-serif;
  -webkit-font-smoothing: antialiased;
}
button,
input,
textarea,
select {
  font: inherit;
}
button,
a,
input,
textarea,
select {
  -webkit-tap-highlight-color: transparent;
}
button {
  color: inherit;
  cursor: pointer;
  border: 0;
  background: none;
}
button:disabled {
  cursor: wait;
  opacity: 0.62;
}
button,
a {
  touch-action: manipulation;
}
button:focus-visible,
a:focus-visible,
input:focus-visible,
textarea:focus-visible,
select:focus-visible,
summary:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 5px;
}
button {
  transition:
    transform 0.2s,
    border-color 0.2s;
}
button:active:not(:disabled) {
  transform: translateY(1px);
}
button svg {
  flex-shrink: 0;
}
a {
  color: inherit;
}
h1,
h2,
h3,
p {
  margin-top: 0;
}
h1,
h2,
h3 {
  font-weight: 600;
}
h1:focus {
  outline: 0;
}
h1 {
  line-height: 1.08;
  letter-spacing: -0.055em;
}
h2 {
  letter-spacing: -0.035em;
  line-height: 1.2;
}
h3 {
  letter-spacing: -0.02em;
}
small {
  font-size: 11px;
}
svg {
  width: 22px;
  height: 22px;
  vertical-align: middle;
}
input,
textarea,
select {
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--text);
  border-radius: 9px;
  padding: 12px 14px;
  min-width: 0;
}
input::placeholder,
textarea::placeholder {
  color: var(--faint);
}
textarea {
  resize: vertical;
}
input[type='checkbox'] {
  accent-color: #bb925a;
  min-width: 18px;
  width: 18px;
  height: 18px;
}
button,
summary {
  user-select: none;
}
[hidden] {
  display: none !important;
}
.subtle {
  color: var(--muted);
}
.full {
  width: 100%;
}
.skip-link {
  position: fixed;
  left: 20px;
  top: -80px;
  z-index: 3000;
  background: var(--accent);
  color: var(--accent-ink);
  padding: 12px 20px;
  border-radius: 8px;
}
.skip-link:focus {
  top: 12px;
}
.eyebrow {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.18em;
  color: var(--muted);
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 18px;
}
.eyebrow > span:first-child:not(.status-spark) {
  color: var(--accent);
}
.sample-label {
  font-size: 9px;
  letter-spacing: 0.1em;
  font-weight: 700;
  color: var(--muted);
}
.icon-button {
  width: 42px;
  height: 42px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  flex-shrink: 0;
}
.icon-button:hover {
  background: var(--surface-2);
}
.button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  min-height: 48px;
  padding: 13px 20px;
  border-radius: 9px;
  font-size: 12px;
  font-weight: 700;
  line-height: 1.4;
  white-space: normal;
}
.button svg {
  width: 19px;
  height: 19px;
}
.button.primary {
  background: #e4bc80;
  color: #24281f;
}
.button.primary:hover {
  background: #f0cf9e;
  box-shadow: 0 4px 18px #e4bc8015;
}
.button.quiet {
  border: 1px solid var(--line);
  background: transparent;
  color: var(--text);
}
.button.quiet:hover {
  background: var(--surface-2);
  border-color: var(--faint);
}
.text-action {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  font-size: 12px;
  font-weight: 700;
  color: var(--accent);
  padding: 10px 0;
  min-height: 44px;
  text-align: left;
}
.text-action svg {
  width: 17px;
  height: 17px;
}
.text-action:hover {
  gap: 15px;
}
.avatar {
  width: 43px;
  height: 43px;
  border-radius: 50%;
  display: inline-flex;
  justify-content: center;
  align-items: center;
  background: #aeb7a0;
  color: #273023;
  font-size: 12px;
  font-weight: 700;
  flex-shrink: 0;
  border: 3px solid var(--surface);
}
.avatar.warm {
  background: #d0b494;
  color: #322c23;
}
.avatar.outline {
  background: var(--surface);
  color: var(--muted);
  border: 1px dashed var(--faint);
}
.avatar.small {
  width: 36px;
  height: 36px;
  font-size: 10px;
}
.status-spark,
.demo-indicator i {
  display: inline-block;
  width: 6px;
  height: 6px;
  background: #d9b577;
  border-radius: 50%;
  box-shadow: 0 0 0 4px #d9b57710;
}

.product-header {
  height: var(--header);
  padding: 0 var(--gutter);
  display: flex;
  align-items: center;
  gap: 26px;
  border-bottom: 1px solid var(--line);
  position: relative;
  z-index: 900;
  background: var(--bg);
}
.product-brand {
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 0;
  font-weight: 700;
  font-size: 29px;
  letter-spacing: -1.5px;
  line-height: 1;
}
.brand-symbol {
  width: 29px;
  height: 34px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--accent);
}
.brand-symbol svg {
  width: 29px;
  height: 34px;
  stroke-width: 1.8;
}
.brand-period {
  color: var(--accent);
}
.brand-divider {
  width: 1px;
  height: 24px;
  background: var(--line);
}
.header-context {
  font-size: 9px;
  font-weight: 600;
  letter-spacing: 0.13em;
  color: var(--muted);
}
.desktop-links {
  display: flex;
  align-items: center;
  gap: 24px;
  margin: auto;
}
.desktop-links button {
  min-height: 44px;
  padding: 0;
  font-size: 11px;
  color: var(--muted);
  white-space: nowrap;
}
.desktop-links button:hover,
.desktop-links button.selected {
  color: var(--text);
}
.header-actions {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-left: auto;
}
.demo-indicator {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 9px;
  font-weight: 600;
  letter-spacing: 0.12em;
}
.language-control {
  font-size: 11px;
  font-weight: 700;
  width: 38px;
  height: 40px;
  border: 1px solid var(--line);
  border-radius: 7px;
}
.language-control:hover {
  background: var(--surface-2);
}
.header-alert {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 14px;
  border: 1px solid var(--line);
  border-radius: 7px;
  min-height: 40px;
  font-size: 10px;
  font-weight: 700;
}
.header-alert svg {
  width: 15px;
  height: 15px;
  color: var(--accent);
}
.header-alert:hover {
  border-color: var(--accent);
}
.header-avatar {
  width: 34px;
  height: 34px;
  font-size: 10px;
  border: 0;
}
.theme-control {
  width: 33px;
  height: 40px;
}
.theme-control svg {
  width: 17px;
}
#app-main {
  height: calc(100dvh - var(--header) - var(--dock-space));
  outline: none;
  display: grid;
  grid-template-rows: minmax(0, 1fr) auto;
}
.map-credit {
  display: none;
  padding: 4px var(--gutter);
  text-align: right;
  font-size: 10px;
  line-height: 16px;
  color: var(--muted);
  background: var(--bg);
}
body:is([data-screen='home'], [data-screen='alerts'], [data-screen='network'])
  .map-credit {
  display: block;
}
.map-credit a {
  color: inherit;
  text-decoration: none;
}
.map-credit a:hover {
  text-decoration: underline;
}
.product-screen {
  height: 100%;
  min-height: 0;
  overflow: auto;
  overscroll-behavior: contain;
  scrollbar-width: thin;
  scrollbar-color: var(--line) transparent;
  animation: screen-in 0.4s ease both;
}
.padded-screen {
  padding: 44px var(--gutter) 38px;
}
.page-heading {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 30px;
  margin-bottom: 38px;
}
.page-heading .eyebrow {
  margin-bottom: 14px;
  gap: 20px;
}
.page-heading h1 {
  font-size: clamp(34px, 3.4vw, 52px);
  margin: 0 0 13px;
}
.page-heading > .button {
  margin-bottom: 7px;
}
.page-description {
  color: var(--muted);
  line-height: 1.7;
  font-size: 12px;
  margin-bottom: 0;
}
.section-line {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  margin-bottom: 15px;
}
.section-line h2 {
  font-size: 16px;
  margin: 0;
}
.section-line > svg {
  width: 17px;
  color: var(--muted);
}
.session-note {
  display: block;
  color: var(--muted);
  font-size: 10px;
  line-height: 1.7;
  margin: 17px 0 0;
}
.empty-state {
  text-align: center;
  padding: 35px 16px;
  color: var(--muted);
}
.empty-state > svg {
  width: 30px;
  height: 30px;
  margin-bottom: 15px;
}
.empty-state h3,
.empty-state h2 {
  color: var(--text);
  font-size: 17px;
  margin-bottom: 8px;
}
.empty-state p {
  font-size: 12px;
  margin: 0;
}
.search-field {
  display: flex;
  align-items: center;
  gap: 10px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--surface);
  padding: 0 13px;
  min-height: 45px;
}
.search-field svg {
  width: 16px;
  color: var(--muted);
}
.search-field input {
  border: 0;
  outline: 0;
  background: transparent;
  padding: 11px 0;
  font-size: 11px;
  flex: 1;
  width: 100%;
}
.search-field:focus-within {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.home-screen {
  display: grid;
  grid-template-rows: minmax(0, 1fr) 100px;
  overflow: hidden;
}
.home-stage {
  position: relative;
  isolation: isolate;
  min-height: 450px;
  overflow: hidden;
}
.home-map {
  position: absolute;
  inset: 0 -15% 0 16%;
  z-index: -3;
  pointer-events: none;
  background: #2d382f;
}
.home-map .leaflet-control-attribution {
  right: 16%;
  position: relative;
}
.home-map-veil {
  position: absolute;
  inset: 0;
  z-index: -2;
  pointer-events: none;
  background:
    linear-gradient(
      90deg,
      var(--bg) 2%,
      var(--bg) 22%,
      color-mix(in srgb, var(--bg) 95%, transparent) 38%,
      color-mix(in srgb, var(--bg) 28%, transparent) 72%,
      color-mix(in srgb, var(--bg) 10%, transparent)
    ),
    linear-gradient(0deg, var(--bg), transparent 28%);
}
.home-coordinates {
  position: absolute;
  top: 30px;
  right: var(--gutter);
  font-size: 8px;
  font-weight: 600;
  letter-spacing: 0.15em;
  color: var(--muted);
  display: flex;
  gap: 20px;
  z-index: 1;
}
.home-copy {
  padding: clamp(44px, 5vh, 78px) 0 0 var(--gutter);
  width: 64%;
  max-width: 870px;
}
.home-copy > .eyebrow {
  margin-bottom: 24px;
}
.home-copy h1 {
  font-size: clamp(56px, 6.1vw, 96px);
  font-weight: 500;
  line-height: 1.04;
  letter-spacing: -0.065em;
  margin: 0 0 24px;
}
.home-copy > p:not(.eyebrow) {
  max-width: 390px;
  font-size: 13px;
  line-height: 1.9;
  color: var(--muted);
  margin-bottom: 25px;
}
.hero-actions {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}
.home-greeting {
  display: flex;
  gap: 11px;
  align-items: center;
  margin-top: 33px;
  font-size: 10px;
  color: var(--muted);
}
.home-greeting strong {
  color: var(--text);
  font-weight: 600;
}
.home-greeting small {
  display: block;
  font-size: 9px;
  line-height: 1.6;
  margin-top: 3px;
}
.home-map-label {
  position: absolute;
  right: var(--gutter);
  top: 30%;
  display: flex;
  align-items: center;
  gap: 15px;
  text-align: left;
  background: color-mix(in srgb, var(--surface) 86%, transparent);
  border: 1px solid var(--line);
  padding: 14px 18px;
  border-radius: 10px;
  backdrop-filter: blur(14px);
  box-shadow: var(--shadow);
  z-index: 2;
}
.home-map-label small {
  display: block;
  font-size: 8px;
  letter-spacing: 0.12em;
  color: var(--muted);
  margin-bottom: 4px;
}
.home-map-label strong {
  font-size: 11px;
  font-weight: 500;
}
.home-map-label > svg {
  margin-left: 14px;
  width: 15px;
  color: var(--accent);
}
.locator-orbit {
  color: var(--accent);
  position: relative;
  width: 34px;
  height: 34px;
  display: grid;
  place-items: center;
  border: 1px solid var(--accent);
  border-radius: 50%;
}
.locator-orbit:after {
  content: '';
  position: absolute;
  inset: -6px;
  border: 1px solid var(--accent);
  border-radius: 50%;
  opacity: 0.3;
  animation: locator-pulse 4s ease-out infinite;
}
.home-circle-card {
  position: absolute;
  right: calc(var(--gutter) + 50px);
  bottom: 70px;
  text-align: left;
  border: 1px solid var(--line);
  background: color-mix(in srgb, var(--surface) 94%, transparent);
  backdrop-filter: blur(12px);
  box-shadow: var(--shadow);
  width: 285px;
  padding: 23px;
  border-radius: 13px;
  animation: gentle-float 10s ease-in-out infinite;
}
.home-circle-card > .eyebrow {
  font-size: 8px;
  margin-bottom: 18px;
}
.circle-avatars {
  display: flex;
  margin-bottom: 15px;
}
.circle-avatars > .avatar:not(:first-child) {
  margin-left: -7px;
}
.home-circle-card > strong {
  display: block;
  font-size: 15px;
  font-weight: 500;
  margin-bottom: 6px;
  letter-spacing: -0.03em;
}
.home-circle-card > .subtle {
  display: block;
  font-size: 10px;
}
.card-arrow {
  position: absolute;
  right: 22px;
  top: 65px;
  color: var(--accent);
  width: 17px;
  height: 17px;
}
.home-scene-caption {
  position: absolute;
  bottom: 25px;
  right: var(--gutter);
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 8px;
  letter-spacing: 0.025em;
  color: var(--muted);
}
.connection-line {
  height: 1px;
  width: 35px;
  background: var(--accent);
}
.home-bottom {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  padding: 0 var(--gutter);
  border-top: 1px solid var(--line);
  position: relative;
  background: var(--bg);
  z-index: 1;
}
.home-summary {
  display: flex;
  align-items: center;
  gap: 19px;
  padding: 20px 28px;
  text-align: left;
  min-width: 0;
  border-right: 1px solid var(--line);
}
.home-summary:first-child {
  padding-left: 0;
}
.home-summary:last-child {
  border: 0;
  padding-right: 0;
}
.home-summary:hover .summary-icon {
  color: var(--accent);
  transform: translateY(-3px);
}
.summary-icon {
  width: 39px;
  height: 39px;
  display: grid;
  place-items: center;
  border: 1px solid var(--line);
  border-radius: 10px;
  color: var(--muted);
  transition: transform 0.3s;
}
.summary-icon svg {
  width: 18px;
}
.home-summary > span:nth-child(2) {
  flex: 1;
}
.home-summary small {
  display: block;
  color: var(--muted);
  font-size: 8px;
  letter-spacing: 0.14em;
  margin-bottom: 7px;
}
.home-summary strong {
  display: block;
  font-size: 12px;
  font-weight: 500;
  letter-spacing: -0.015em;
}
.home-summary > svg {
  width: 15px;
  height: 15px;
  color: var(--faint);
}

.dock-wrap {
  position: fixed;
  bottom: calc(20px + env(safe-area-inset-bottom));
  left: 50%;
  transform: translateX(-50%);
  z-index: 1000;
}
.product-dock {
  --dock-index: 2;
  position: relative;
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 0;
  width: 462px;
  padding: 6px;
  border: 1px solid #5c645944;
  border-radius: 22px;
  background: #2a302ceb;
  backdrop-filter: blur(24px);
  box-shadow:
    0 12px 40px #0005,
    inset 0 1px #ffffff0d;
}
.product-dock button {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 5px;
  min-height: 60px;
  border-radius: 17px;
  font-size: 9px;
  font-weight: 500;
  color: #b5bcb1;
  white-space: nowrap;
}
.product-dock button svg {
  width: 21px;
  height: 21px;
  stroke-width: 1.6;
}
.product-dock button[aria-current] {
  color: #edc88e;
}
.product-dock button:hover {
  color: #fff;
}
.dock-indicator {
  position: absolute;
  left: 6px;
  top: 6px;
  height: 60px;
  width: calc((100% - 12px) / 5);
  border-radius: 16px;
  background: #46483b;
  border: 1px solid #9d8b5824;
  transform: translateX(calc(var(--dock-index) * 100%));
  transition: transform 0.4s cubic-bezier(0.22, 0.8, 0.24, 1);
}
.desktop-agent {
  position: fixed;
  right: var(--gutter);
  bottom: 31px;
  display: flex;
  align-items: center;
  gap: 12px;
  z-index: 999;
  text-align: left;
  color: var(--text);
  padding: 6px 0;
}
.desktop-agent > span:nth-child(2) {
  font-size: 11px;
  font-weight: 600;
}
.desktop-agent small {
  display: block;
  font-size: 8px;
  color: var(--muted);
  font-weight: 400;
  margin-top: 3px;
}
.desktop-agent > svg {
  width: 13px;
  color: var(--muted);
  margin-left: 10px;
}
.agent-mini-orb {
  width: 34px;
  height: 34px;
  display: grid;
  place-items: center;
  border: 1px solid var(--line);
  border-radius: 50%;
  background: radial-gradient(
    circle at 65% 25%,
    #cfb58b80,
    #68725b33 50%,
    transparent
  );
}
.agent-mini-orb svg {
  width: 16px;
  color: var(--accent);
}
body[data-screen='assistant'] .desktop-agent {
  visibility: hidden;
}

.network-screen {
  display: grid;
  grid-template-columns: 365px 1fr;
  overflow: hidden;
}
.network-sidebar {
  display: flex;
  flex-direction: column;
  min-width: 0;
  padding: 29px 24px 12px var(--gutter);
  border-right: 1px solid var(--line);
  overflow: hidden;
}
.network-sidebar > .eyebrow {
  margin-bottom: 14px;
  font-size: 8px;
}
.network-sidebar > h1 {
  font-size: 33px;
  margin: 0 0 12px;
}
.network-sidebar > .page-description {
  font-size: 11px;
  margin-bottom: 20px;
}
.network-sidebar .search-field {
  min-height: 42px;
  flex-shrink: 0;
}
.filter-tabs {
  display: flex;
  gap: 5px;
  margin: 14px 0 16px;
  flex-shrink: 0;
}
.filter-tabs button {
  font-size: 9px;
  border: 1px solid var(--line);
  padding: 8px 11px;
  border-radius: 6px;
  min-height: 34px;
  flex: 1;
  white-space: nowrap;
  color: var(--muted);
}
.filter-tabs button.selected {
  background: var(--accent-soft);
  color: var(--accent);
  border-color: var(--accent-soft);
}
.results-caption {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 10px;
  margin: 4px 0 12px;
  color: var(--muted);
}
.results-caption .sample-label {
  font-size: 7px;
}
.network-results {
  overflow: auto;
  scrollbar-width: thin;
  scrollbar-color: var(--line) transparent;
  min-height: 70px;
  margin-right: -8px;
  padding-right: 8px;
}
.location-row {
  display: flex;
  width: 100%;
  text-align: left;
  gap: 12px;
  padding: 18px 0;
  border-top: 1px solid var(--line);
  align-items: flex-start;
}
.location-row:hover,
.location-row.selected {
  background: var(--surface);
}
.location-initial {
  width: 36px;
  height: 39px;
  border: 1px solid var(--line);
  border-radius: 8px;
  display: grid;
  place-items: center;
  color: var(--accent);
  flex-shrink: 0;
  background: var(--accent-soft);
}
.location-initial.community {
  background: var(--surface-2);
  color: var(--muted);
}
.location-initial svg {
  width: 18px;
  height: 18px;
}
.location-row > span:nth-child(2) {
  flex: 1;
  min-width: 0;
}
.location-row small {
  display: flex;
  justify-content: space-between;
  font-size: 8px;
  color: var(--muted);
  margin-bottom: 5px;
}
.location-row small span {
  opacity: 1;
}
.location-row strong {
  display: block;
  font-size: 11px;
  font-weight: 600;
  margin-bottom: 6px;
}
.location-row > span > span {
  display: block;
  font-size: 9px;
  color: var(--muted);
  line-height: 1.6;
}
.location-row em {
  display: block;
  font-size: 8px;
  font-style: normal;
  color: var(--faint);
  margin-top: 7px;
}
.location-row > svg {
  width: 13px;
  height: 13px;
  margin-top: 3px;
  color: var(--muted);
}
.network-note {
  font-size: 8px;
  color: var(--muted);
  line-height: 1.7;
  margin: 12px 0 0;
  max-width: 260px;
}
.network-canvas {
  position: relative;
  isolation: isolate;
  overflow: hidden;
  min-height: 350px;
  background: #252e28;
}
#network-map {
  position: absolute;
  inset: 0;
  background: #333e35;
  z-index: 0;
}
.map-dark .leaflet-tile-pane {
  filter: grayscale(1) invert(0.88) sepia(0.17) hue-rotate(31deg) saturate(0.7)
    brightness(0.7) contrast(0.88);
}
.leaflet-container {
  font-family: Manrope, sans-serif;
}
.leaflet-control-attribution {
  font-size: 8px !important;
  color: #555 !important;
  background: #f3efe7da !important;
  border-radius: 3px 0 0 0;
  padding: 3px 6px !important;
}
.leaflet-control-attribution a {
  color: #3d4b39 !important;
}
.leaflet-control-zoom {
  border: 1px solid #747d6d66 !important;
  box-shadow: 0 4px 20px #0003 !important;
  border-radius: 8px !important;
  overflow: hidden;

.map-legend {

.map-legend i {

.map-legend .community-dot {

.map-status {

.location-detail {
  position: absolute;
  right: 25px;
  bottom: 30px;

  padding: 26px;
  background: var(--surface);

  border-radius: 12px;
  box-shadow: var(--shadow);

}
.detail-close {
  position: absolute;
  right: 8px;
  top: 8px;
  width: 30px;
  height: 30px;
}
.detail-close svg {
  width: 16px;
}
.location-detail > .eyebrow {

}
.detail-title {

.detail-title h2 {

.location-detail > p:not(.eyebrow) {

.detail-facts {

.detail-facts span {

.detail-facts svg {

.document-layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 280px;
  gap: 48px;
}
.document-main {
  min-width: 0;
}
.folder-strip {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
  margin-bottom: 29px;
}
.folder-button {
  text-align: left;
  min-width: 0;
  padding: 8px 12px 14px;
  border-radius: 10px;
  border: 1px solid transparent;
  transition: background 0.2s;
}
.folder-button:hover,
.folder-button.selected {
  background: var(--surface);
  border-color: var(--line);
}
.folder-art {
  display: block;
  width: 100%;
  height: 83px;
  position: relative;
  margin-bottom: 12px;
  perspective: 500px;
}
.folder-art > i:first-child {
  position: absolute;
  inset: 10px 0 3px;
  background: #7f8065;
  border-radius: 5px 8px 8px 8px;
  transform: rotate(-4deg);
}
.folder-art > i:first-child:before {
  content: '';
  position: absolute;
  top: -7px;
  width: 40%;
  height: 14px;
  background: #7f8065;
  border-radius: 4px 6px 0 0;
}
.folder-art > i:nth-child(2) {
  position: absolute;
  inset: 20px 8px 0;
  background: #d5d4bd;
  border-radius: 3px;
  transform: rotate(-4deg);
  transition: transform 0.4s;
}
.folder-art > b {
  position: absolute;
  inset: 23px 0 0;
  background: linear-gradient(120deg, #bbbc9f, #898e73);
  border: 1px solid #d3d7b477;
  border-radius: 5px 6px 7px 7px;
  display: flex;
  align-items: center;
  padding-left: 15px;
  box-shadow: 0 5px 8px #0002;
  transform-origin: bottom;
  transition: transform 0.4s;
  transform: rotateX(-8deg);
}
.folder-art > b > svg {
  color: #3d4931;
  opacity: 0.7;
  width: 20px;
  height: 20px;
  stroke-width: 1.3;
}
.folder-button:hover .folder-art > b {
  transform: rotateX(-28deg);
}
.folder-button:hover .folder-art > i:nth-child(2) {
  transform: rotate(-6deg) translateY(-8px);
}
.folder-button:nth-child(2) .folder-art > b {
  background: linear-gradient(120deg, #c1ab8c, #9d876c);
}
.folder-button:nth-child(3) .folder-art > b {
  background: linear-gradient(120deg, #a9b5a8, #7e9586);
}
.folder-button:nth-child(4) .folder-art > b {
  background: linear-gradient(120deg, #b2b1bf, #8b8b9a);
}
.folder-button > strong {
  display: block;
  font-size: 12px;
  font-weight: 600;
  margin-bottom: 5px;
}
.folder-button > small {
  font-size: 9px;
  color: var(--muted);
}
.document-search {
  margin-bottom: 20px;
}
.file-table-head {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 100px 65px 20px;
  padding: 0 12px 11px;

  font-size: 7px;
  letter-spacing: 0.12em;
  color: var(--faint);
}
.document-row {
  width: 100%;
  display: grid;
  grid-template-columns: minmax(0, 1fr) 100px 65px 20px;
  align-items: center;

  border-top: 1px solid var(--line);
  padding: 15px 12px;

}
.document-row:hover {

.file-name {

}
.file-name > span:nth-child(2) {

}
.file-name strong {

.file-name small {

}
.file-icon {

}
.file-icon svg {
  width: 17px;
}
.file-category,
.file-size {
  font-size: 9px;

.document-row > svg {

}
.drop-area {
  display: flex;

  gap: 8px;

  margin-top: 22px;

    border 0.2s,
    background 0.2s;
}
.drop-area > svg {
  width: 20px;

}

}
.drop-area small {

}
.drop-area.dragover {

.preparation-aside {

}
.preparation-aside > .eyebrow {
  font-size: 8px;

  height: 142px;

  place-items: center;
}
.readiness-ring svg {
  position: absolute;
  inset: 0;

.readiness-ring circle {

.readiness-ring strong {

}
.readiness-ring strong span {
  font-size: 15px;
  margin-left: 2px;

}
.preparation-aside h2 {
  font-size: 22px;
  margin-bottom: 12px;
}
.preparation-aside > p:not(.eyebrow) {
  font-size: 10px;
  line-height: 1.8;
  color: var(--muted);
  margin-bottom: 20px;
}
.preparation-row {
  display: flex;
  width: 100%;
  align-items: center;
  gap: 9px;
  padding: 11px 0;
  font-size: 10px;
  color: var(--muted);

.preparation-row > span {
  display: grid;

.preparation-row svg {
  width: 12px;
  height: 12px;
}
.preparation-row small {
  margin-left: auto;

}
.preparation-row.prepared {

.preparation-row.prepared > span {

#preparation-list {
  margin-bottom: 22px;
}
.preparation-aside .button {

.assistant-screen {
  display: grid;
  grid-template-columns: 300px minmax(0, 1fr);
  overflow: hidden;
}
.assistant-context {
  padding: 32px 28px 20px var(--gutter);
  border-right: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  overflow: auto;
}
.ai-wordmark {
  display: flex;
  gap: 10px;
  align-items: center;
  margin-bottom: 15px;
}
.ai-wordmark > svg {
  color: var(--accent);

}
.ai-wordmark strong {
  font-weight: 600;
  font-size: 17px;
  letter-spacing: -0.035em;
}
.ai-wordmark > .sample-label {
  font-size: 7px;
  margin-left: auto;
}
.assistant-context > .page-description {
  font-size: 11px;
  margin-bottom: 24px;
}
.assistant-context > .button {

  min-height: 42px;
  justify-content: flex-start;
}
.context-label {
  margin: 40px 0 15px;
  font-size: 8px;
}
.context-row {
  display: flex;
  align-items: center;
  gap: 13px;
  text-align: left;
  padding: 16px 0;
  border-bottom: 1px solid var(--line);
}
.context-row > svg:first-child {
  width: 18px;
  height: 18px;

}
.context-row > svg:last-child {
  width: 13px;

  color: var(--muted);
}
.context-row > span {
  font-size: 11px;

.context-row small {

.ai-context-note {

.ai-context-note svg {
  width: 15px;
  height: 15px;
  flex-shrink: 0;
  margin-top: 2px;
}
.assistant-conversation {
  display: flex;
  flex-direction: column;
  min-width: 0;
  min-height: 0;
  position: relative;
  background: radial-gradient(
    ellipse at 50% 25%,
    color-mix(in srgb, var(--surface-2) 70%, transparent),
    transparent 60%
  );
}
.assistant-mobile-title {
  display: none;
}
.assistant-thread {
  overflow: auto;

  scroll-behavior: smooth;
}
.assistant-empty {
  text-align: center;

  align-items: center;
  flex-direction: column;
  padding: 3px 0 20px;
}
.ai-orb {
  width: 112px;
  height: 112px;
  position: relative;
  display: grid;
  place-items: center;
  margin: 6px auto 24px;
  background: radial-gradient(circle at 70% 28%, #d7c09a55, #75836f0a 70%);
  border-radius: 50%;
  box-shadow: inset 0 0 30px #c1b38910;
}
.ai-orb > i {
  position: absolute;
  inset: 8px;
  border: 1px solid #c3b59199;
  border-radius: 50%;
  transform: rotate(-30deg) scaleX(0.63);
  animation: orb-turn 16s linear infinite;
}
.ai-orb > i:nth-child(2) {
  transform: rotate(45deg) scaleX(0.65);
  animation-direction: reverse;
  animation-duration: 22s;
}
.ai-orb > span {
  display: grid;
  place-items: center;
  width: 75px;
  height: 75px;
  border: 1px solid #9d9c7d77;
  border-radius: 50%;
  box-shadow: 0 0 40px #c2ba8a16;
}
.ai-orb svg {
  width: 28px;
  height: 28px;
  color: var(--accent);
  stroke-width: 1.2;

.assistant-empty > .eyebrow {
  font-size: 8px;
  letter-spacing: 0.2em;
  margin-bottom: 15px;
}
.assistant-empty h1 {
  font-size: clamp(32px, 3.7vw, 56px);
  font-weight: 500;
  line-height: 1.08;
  letter-spacing: -0.05em;
  margin: 0 0 16px;
}
.assistant-empty > p:not(.eyebrow) {
  font-size: 11px;
  color: var(--muted);
  margin-bottom: 25px;
}
.prompt-grid {

  display: flex;
  align-items: center;
  gap: 12px;
  padding: 16px;
  border: 1px solid var(--line);
  border-radius: 9px;

  background: color-mix(in srgb, var(--bg) 65%, transparent);

.prompt-grid button:hover {
  background: var(--surface-2);
  border-color: var(--faint);
}
.prompt-grid button span {
  font-size: 10px;
  flex: 1;
}
.prompt-grid button > svg:first-child {
  width: 17px;
  height: 17px;
  color: var(--accent);
}
.prompt-grid button > svg:last-child {
  width: 12px;
  height: 12px;
  color: var(--muted);
}
.composer-wrap {
  padding: 0 max(36px, 8%) 8px;
}
.assistant-composer {
  display: flex;
  align-items: flex-end;
  gap: 7px;
  padding: 9px;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: var(--surface);
  box-shadow: 0 8px 35px #0001;
}

  line-height: 1.6;
  padding: 10px 4px;

.assistant-composer .icon-button {
  width: 34px;
  height: 40px;
  border-radius: 9px;
  color: var(--muted);
}
.assistant-composer .icon-button svg {
  width: 18px;
  height: 18px;
}
.send-button {
  width: 38px;
  height: 38px;
  border-radius: 9px;

  place-items: center;

  color: #24281f;

}
.send-button svg {
  width: 17px;
  height: 17px;
}
.composer-note {
  text-align: center;
  font-size: 8px;
  color: var(--faint);
  margin: 10px 0 0;
}
#voice-status {

.chat-avatar {

  height: 28px;

.chat-message > div {

.chat-message small {

.chat-message.user {

.chat-message.user p {

.chat-action {

  gap: 15px;

  background: var(--surface-2);
}
.chat-action svg {
  width: 15px;
  height: 15px;
}

  gap: 5px;
  height: 28px;

.thinking i {

  animation-delay: 0.3s;

.product-toast {
  position: fixed;
  left: 50%;
  bottom: calc(112px + env(safe-area-inset-bottom));
  z-index: 3000;
  transform: translate(-50%, 15px);
  opacity: 0;
  pointer-events: none;
  transition:
    opacity 0.2s,
    transform 0.2s;
  background: var(--text);
  color: var(--bg);
  border-radius: 8px;
  padding: 13px 19px;
  box-shadow: var(--shadow);
  font-size: 11px;
  max-width: calc(100% - 40px);
  text-align: center;
}
.product-toast.visible {
  opacity: 1;
  transform: translate(-50%, 0);
}
@keyframes screen-in {
  from {
    opacity: 0;
    transform: translateY(7px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}
@keyframes dialog-in {
  from {
    opacity: 0;
    transform: translateY(12px) scale(0.98);
  }
  to {
    opacity: 1;
    transform: none;
  }
}
@keyframes locator-pulse {
  0% {
    opacity: 0.5;
    transform: scale(0.94);
  }
  80%,
  100% {
    opacity: 0;
    transform: scale(1.35);
  }
}
@keyframes marker-ripple {
  0% {
    opacity: 0.7;
    transform: scale(0.8);
  }
  85%,
  100% {
    opacity: 0;
    transform: scale(2.2);
  }
}
@keyframes path-flow {
  to {
    stroke-dashoffset: -260;
  }
}
@keyframes gentle-float {
  0%,
  100% {
    transform: translateY(0);
  }
  50% {
    transform: translateY(-6px);
  }
}
@keyframes orb-turn {
  to {
    transform: rotate(330deg) scaleX(0.63);
  }
}
@keyframes think {
  0%,
  70%,
  100% {
    opacity: 0.3;
    transform: translateY(0);
  }
  35% {
    opacity: 1;
    transform: translateY(-3px);
  }
}
@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}
@media (prefers-reduced-motion: reduce) {

  *:before,
  *:after {
    animation: none !important;
    transition: none !important;
    scroll-behavior: auto !important;

.community-filters {

.community-feed-footer {

}

.community-map-canvas {
  position: relative;
  min-width: 0;
  min-height: 390px;
  background: #2b352e;
  isolation: isolate;
}

  position: absolute;
  inset: 0;
  z-index: 0;
  background: #2b352e;
}
.community-map-controls {
  position: absolute;
  top: 16px;
  left: 16px;
  right: 16px;

  justify-content: space-between;
  gap: 10px;
  pointer-events: none;
}
.community-map-controls > * {
  pointer-events: auto;
}
.community-map-layers {
  display: flex;
  background: var(--surface);

}

.community-map-layers button svg {

}
.community-map-layers button.selected {
  color: var(--text);

}
.community-map-fit {
  width: 44px;
  height: 44px;

  background: var(--surface);
  border: 1px solid var(--line);

}
.community-map-fit svg {
  width: 19px;
  height: 19px;
}
.community-map-summary {
  position: absolute;
  top: 76px;
  left: 16px;
  z-index: 600;
  display: flex;
  gap: 6px;

  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 7px;
  padding: 4px 10px;
  font-size: 10px;
  box-shadow: 0 3px 15px #0001;

.community-map-summary strong {

.community-map-summary > span:not(.community-signal) {

.community-map-summary .community-signal {

.community-map-summary button {

.community-map-legend {

  border-radius: 6px;
  padding: 10px 12px;

.community-map-legend .detention,
.community-type.detention i {

}
.community-map-legend .advisory,
.community-type.advisory i {
  background: var(--alert-green);
}
.community-marker {
  color: #ef9b83;
}
.community-marker.presence {
  color: #edc182;
}
.community-marker.advisory {
  color: #a7cabb;
}
.community-marker-core {
  display: grid;
  place-items: center;
  width: 38px;
  height: 38px;
  border: 1.5px solid currentColor;
  border-radius: 50%;
  background: #1c2822ed;
  box-shadow: 0 3px 12px #0005;
  position: absolute;
}
.community-marker-core svg {
  width: 19px;
  height: 19px;
}
.community-marker-core b {
  font-size: 13px;
  font-family: Manrope, Arial, sans-serif;
}
.community-marker-ring {
  position: absolute;
  inset: -7px;
  border: 1px solid currentColor;
  border-radius: 50%;
  opacity: 0.25;
  animation: community-pulse 4s ease-out infinite;
}
.community-marker.active .community-marker-core {
  background: #37493d;
  transform: scale(1.15);
  border-width: 2px;
}
.community-marker:hover .community-marker-core {

}
.community-map-canvas .leaflet-bottom.leaflet-right {
  bottom: 50px;
  right: 9px;
}
.community-map-canvas .leaflet-control-attribution {

  right: 0;
  bottom: -50px;
  width: max-content;
}
.community-map-error {
  position: absolute;
  top: 118px;
  left: 16px;
  right: 70px;
  z-index: 600;
  font-size: 11px;
  color: #f9dcc1;
  background: #49382a;
  border-radius: 6px;
}
.community-map-error:not(:empty) {
  padding: 10px 12px;
}
.community-detail {
  position: absolute;
  z-index: 650;
  left: 16px;
  bottom: 66px;
  width: min(370px, calc(100% - 95px));
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 17px 20px;
  box-shadow: 0 14px 45px #0005;
  max-height: calc(100% - 125px);
  overflow: auto;
}

  align-items: center;
  gap: 9px;
  margin-bottom: 12px;
}
.community-detail-top .icon-button {
  margin: -8px -8px -8px auto;
  width: 34px;
  height: 34px;
}
.community-detail-top .icon-button svg {
  width: 17px;
}
.community-detail h2 {
  font-size: 21px;
  margin-bottom: 10px;
}
.community-detail-location {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 11px;
  margin-bottom: 15px;
}
.community-detail-location svg {
  width: 14px;
  height: 14px;
  color: var(--accent);
}
.community-detail-location span {
  color: var(--muted);
}
.community-detail > p {
  font-size: 12px;
  line-height: 1.7;
  color: var(--muted);
}
.community-detail dl {
  margin: 15px 0;
  padding: 11px 0;
  border-block: 1px solid var(--line);
  font-size: 10px;
}
.community-detail dl div {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  padding: 4px 0;
}
.community-detail dt {
  color: var(--muted);
}
.community-detail dd {
  margin: 0;
  text-align: right;
}
.community-detail-actions {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 14px;
  justify-content: space-between;
}
.community-detail-actions .button {
  font-size: 10px;
  padding: 9px 12px;
  min-height: 40px;
  gap: 5px;
}
.community-detail-actions .button svg {
  width: 14px;
}
.community-detail-actions .text-action {
  font-size: 10px;
}
.community-detail > small {
  display: block;
  color: var(--muted);
  font-size: 9px;
  margin-top: 12px;
  line-height: 1.6;

@keyframes community-pulse {
  0% {
    transform: scale(0.75);
    opacity: 0.4;
  }
  80%,
  100% {
    transform: scale(1.3);
    opacity: 0;
  }

@media (prefers-reduced-motion: reduce) {
  .community-marker-ring {
    animation: none;
    opacity: 0.18;
  }

    set("#welcome-name", state.name.split(/\s+/)[0]);

      "#home-readiness",
      `${categories.size} / 5 ${t("categories ready", "categor\xEDas listas")}`

    set(
      "#home-circle-count",
      `${state.contacts.length} ${t("trusted contacts", "contactos de confianza")}`

  // public/product-events.js
  function bindProductEvents(app) {
    const { document: document2, window: window2 } = app;
    const onClick = (event) => {
      dispatchProductClick(app, event).catch(
        () => app.toast(
          app.text(
            "That action could not finish. Please try again.",
            "No se pudo completar la acci\xF3n. Intenta otra vez."
          )
        )
      );
    };
    const onSubmit = (event) => {
      if (event.target.id === "account-access-form") {
        event.preventDefault();
        app.account.submit(event.target);
      }
      if (event.target.id === "family-update-form") {
        event.preventDefault();
        app.family.submit(event.target);
      }
      if (event.target.id === "community-report-form") {
        event.preventDefault();
        app.community.submit(event.target);
      }
      if (event.target.id === "assistant-form") {
        event.preventDefault();
        app.assistant.send(document2.querySelector("#assistant-input").value);
      }
      if (event.target.id === "product-dialog-form") {
        event.preventDefault();
        app.dialogs.submit(event.target);
      }
    };
    const onInput = (event) => {
      if (event.target.id === "report-photos") app.family.addPhotos(event.target);
      app.community?.input(event.target);
      if (event.target.id === "network-search") {
        app.filters.networkQuery = event.target.value;
        app.updateNetwork();
      }
      if (event.target.id === "document-search") {
        app.filters.documentQuery = event.target.value;
        app.renderState();
      }
    };
    const onKey = (event) => {
      if (event.key === "Escape") {
        const menu = document2.querySelector(".site-menu[open]");
        if (menu) {
          menu.open = false;
          menu.querySelector("summary").focus();
        }
      }
      if (event.target.id === "assistant-input" && event.key === "Enter" && !event.shiftKey && !event.isComposing) {
        event.preventDefault();
        app.assistant.send(event.target.value);
      }
    };
    const onDrop = (event) => {
      const target = event.target.closest("#document-drop");
      if (!target) return;
      event.preventDefault();
      target.classList.remove("dragover");
      const file = event.dataTransfer.files[0];
      if (file) app.dialogs.open("upload", { file });
    };
    const onDrag = (event) => {
      const target = event.target.closest("#document-drop");
      if (!target) return;
      event.preventDefault();
      target.classList.add("dragover");
    };
    const onDragLeave = (event) => event.target.closest("#document-drop")?.classList.remove("dragover");
    const onPop = () => app.navigate(window2.location.hash.slice(1), { history: false });
    const handlers = {
      click: onClick,
      submit: onSubmit,
      input: onInput,
      keydown: onKey,
      drop: onDrop,
      dragover: onDrag,
      dragleave: onDragLeave
    };
    for (const [type, handler] of Object.entries(handlers))
      document2.addEventListener(type, handler);
    window2.addEventListener("popstate", onPop);
    return () => {
      for (const [type, handler] of Object.entries(handlers))
        document2.removeEventListener(type, handler);
      window2.removeEventListener("popstate", onPop);
    };
  }

    reported: ["Report received", "Reporte recibido"],
    contacted: ["Family in contact", "Familia en contacto"],

  function createFamilyService({ now = () => /* @__PURE__ */ new Date() } = {}) {
    let cases;
    const reset = () => {
      cases = [
        {
          id: "family-sample",
          name: "Carlos \xB7 sample",
          area: "Miami-Dade",
          audience: "private-family",
          stage: "contacted",
          reportId: null,
          nextCheckAt: new Date(now().getTime() + 36e5).toISOString(),
          events: [
            {
              stage: "reported",
              note: "Sample: Elena opened a private family check-in.",
              at: new Date(now().getTime() - 36e5).toISOString()
            },
            {
              stage: "contacted",
              note: "Sample: family made contact. Confirm the next update together.",
              at: new Date(now().getTime() - 18e5).toISOString()
            }
          ]
        }
      ];
    };
    reset();
    return {
      mode: "demo",
      list: () => structuredClone(cases),
      get: (id) => structuredClone(cases.find((item) => item.id === id)),
      fromReport(report) {
        const existing = cases.find((item2) => item2.reportId === report.id);
        if (existing) return structuredClone(existing);
        const item = {
          id: "family-" + report.id,
          reportId: report.id,
          name: "Family report",
          area: report.name,
          audience: "private-family",
          stage: "reported",
          nextCheckAt: new Date(now().getTime() + 36e5).toISOString(),
          events: [
            {
              stage: "reported",
              note: "Your sample report was received. It is still unconfirmed.",
              at: now().toISOString()
            }
          ]
        };
        cases.unshift(item);
        return structuredClone(item);
      },
      update(id, { stage, note, checkInHours = 1 }) {
        const item = cases.find((entry) => entry.id === id);
        if (!item) throw new Error("Family case not found.");
        if (!Object.hasOwn(familyStages, stage))
          throw new Error("Choose a valid stage.");
        const text2 = String(note ?? "").trim();
        if (text2.length < 8 || text2.length > 800)
          throw new Error("Use an update note of 8 to 800 characters.");
        if (![1, 4, 24, 168].includes(Number(checkInHours)))
          throw new Error("Choose a check-in interval.");
        item.stage = stage;
        item.events.push({ stage, note: text2, at: now().toISOString() });
        item.nextCheckAt = stage === "resolved" ? null : new Date(
          now().getTime() + Number(checkInHours) * 36e5
        ).toISOString();
        return structuredClone(item);
      },
      reset
    };
  }

      const box = this.document.querySelector("#community-load-state");
      if (!box) return;
      box.replaceChildren();
      box.hidden = !this.loading && !this.error;
      if (this.loading)
        box.textContent = this.text(
          "Loading community reports\u2026",
          "Cargando reportes comunitarios\u2026"
        );
      if (this.error) {
        box.textContent = this.text(
          "Reports could not load. Your filters are preserved. ",
          "No se pudieron cargar los reportes. Tus filtros se conservaron. "
        );
        const retry = this.document.createElement("button");
        retry.type = "button";
        retry.dataset.communityAction = "retry";
        retry.textContent = this.text("Try again", "Intentar de nuevo");
        box.append(retry);
      }
    }
    filtered() {
      return queryReports(
        this.data?.reports || [],
        this.filters,
        this.data?.snapshotAt
      );
    }
    render() {
      if (!this.document.querySelector("#community-list")) return;
      this.renderStatus();
      const data = this.filtered();
      this.document.querySelector("#community-list").innerHTML = data.reports.length ? data.reports.map(
        (report) => reportCard(report, this.language, report.id === this.selectedId)
      ).join("") : emptyReports(this.language);
      this.document.querySelector("#community-report-table").innerHTML = reportsTable(data.reports, this.language);
      this.document.querySelector("#community-stats").innerHTML = renderCommunityStats(data, this.language);
      this.document.querySelector('[data-community-stat="reports"]').textContent = data.stats.reports;
      this.document.querySelector("#community-results-summary").textContent = `${data.stats.reports} ${this.text("sample reports", "reportes de ejemplo")}`;
      this.document.querySelector("#community-table-count").textContent = `${data.stats.reports} ${this.text("reports", "reportes")}`;
      this.document.querySelector("#community-watch-count").textContent = this.following.size;
      this.document.querySelectorAll("[data-bar-height]").forEach(
        (bar) => bar.style.setProperty("--bar-height", bar.dataset.barHeight + "%")
      );
      this.document.querySelectorAll("[data-bar-width]").forEach(
        (bar) => bar.style.setProperty("--bar-width", bar.dataset.barWidth + "%")
      );
      this.renderHome();
      this.setTab(this.tab, false);
      this.maps?.update(data.reports);
      const selected = data.reports.find(
        (report) => report.id === this.selectedId
      );
      const detail = this.document.querySelector("#community-detail");
      detail.hidden = !selected;
      if (selected)
        detail.innerHTML = reportDetail(
          selected,
          this.language,
          this.following.has(selected.region)
        ) + (this.app.family?.evidence(selected.id) || "");
    }
    renderHome() {
      this.news.render();
      this.maps?.update(this.filtered().reports, true);

    restoreFilters() {
      for (const [key, value] of Object.entries(this.filters)) {
        const input = this.document.querySelector("#community-" + key);
        if (input) input.value = value;
      }
    }
    input(target) {
      const key = target.id?.replace("community-", "");
      if (!Object.hasOwn(this.filters, key)) return;
      this.filters[key] = target.value;
      this.selectedId = null;
      this.render();
      this.maps.fit();
    }
    setTab(tab, showMap = true) {
      if (!["news", "map", "reports", "stats"].includes(tab)) return;
      this.tab = tab;
      this.document.querySelector(".community-beta").textContent = tab === "news" ? this.text("NEWS", "NOTICIAS") : "DEMO";
      for (const element of this.document.querySelectorAll(
        ".community-filters, .community-export, .community-dataset-note, #community-load-state"
      ))
        element.hidden = tab === "news";
      this.news.show(this.app.current);
      this.document.querySelectorAll("[data-community-panel]").forEach((panel) => {
        panel.hidden = panel.dataset.communityPanel !== tab;
      });
      this.document.querySelectorAll("[data-community-tab]").forEach(
        (button2) => button2.setAttribute(
          "aria-pressed",
          String(button2.dataset.communityTab === tab)
        )
      );
      if (showMap && tab === "map" && this.app.current === "alerts")
        this.show("alerts");
    }
    show(route) {
      this.news.show(route);
      if (!this.data) return;
      if (route === "alerts" && this.tab === "map")
        this.maps.show(this.filtered().reports);
      if (route === "home")
        this.maps.show(
          queryReports(this.data.reports, { range: "7d" }, this.data.snapshotAt).reports,
          true
        );
    }
    select(id) {
      const report = this.data?.reports.find((item) => item.id === id);
      if (!report) return;
      if (!this.filtered().reports.some((item) => item.id === id)) {
        this.filters = defaultFilters();
        this.filters.range = "30d";
        this.restoreFilters();
      }
      this.selectedId = id;
      this.tab = "map";
      this.app.navigate("alerts", { focus: false });
      this.render();
      this.maps.select(report);
      this.document.querySelector("#community-detail h2")?.focus({ preventScroll: true });
    }
    openDialog(mode, html) {
      const dialog = this.document.querySelector("#community-dialog");
      if (!dialog.open) this.opener = this.document.activeElement;
      this.dialogMode = mode;
      this.document.querySelector("#community-dialog-content").innerHTML = html;
      if (!dialog.open) {
        if (dialog.showModal) dialog.showModal();
        else dialog.setAttribute("open", "");
      }
      dialog.querySelector("select, input, button")?.focus();
      this.app.family?.renderDraftPhotos();
    }
    closeDialog() {
      const form2 = this.document.querySelector("#community-report-form");
      if (form2)
        this.draft = Object.fromEntries(new this.app.window.FormData(form2));
      const dialog = this.document.querySelector("#community-dialog");
      if (dialog.close) dialog.close();
      else dialog.removeAttribute("open");
      this.submissionGeneration++;
      this.opener?.isConnected && this.opener.focus();
    }
    follow(region) {
      if (!regions.some((item) => item.id === region)) return;
      if (this.following.has(region)) this.following.delete(region);
      else this.following.add(region);
      this.render();
      this.openDialog("watch", watchForm(this.language, this.following));
    }
    async submit(form2) {
      if (this.sending || this.app.family?.pending || !form2.reportValidity())
        return;
      const generation = ++this.submissionGeneration;
      const lifecycle = this.lifecycle;
      this.sending = true;
      this.draft = Object.fromEntries(new this.app.window.FormData(form2));
      const button2 = form2.querySelector('[type="submit"]');
      button2.disabled = true;
      try {
        this.requestId ||= Array.from(
          this.app.window.crypto.getRandomValues(new Uint32Array(4)),
          (value) => value.toString(16).padStart(8, "0")
        ).join("-");
        const report = await this.api.submit({
          ...this.draft,
          idempotencyKey: this.requestId
        });
        if (lifecycle !== this.lifecycle) return;
        this.app.family?.receive(report, this.draft);
        this.draft = {};
        this.requestId = null;
        await this.load();
        if (generation !== this.submissionGeneration) return;
        this.closeDialog();
        this.draft = {};
        this.select(report.id);
        this.app.toast(
          this.text(
            "Sample report saved as unconfirmed.",
            "Reporte de ejemplo guardado sin confirmar."
          )
        );
      } catch {
        if (lifecycle === this.lifecycle && generation === this.submissionGeneration)
          this.document.querySelector("#community-form-error").textContent = this.text(
            "The report could not be saved. Check the fields and try again.",
            "No se pudo guardar. Revisa los campos e intenta de nuevo."
          );
      } finally {
        if (lifecycle === this.lifecycle) {
          this.sending = false;
          if (button2.isConnected) button2.disabled = false;
        }
      }
    }
    async action(action) {
      if (action === "news-retry") return this.news.ready = this.news.load();
      if (action === "report")
        this.openDialog("report", reportForm(this.language, this.draft));
      if (action === "watch")
        this.openDialog("watch", watchForm(this.language, this.following));
      if (action === "close-dialog") this.closeDialog();
      if (action === "close-detail") {
        this.selectedId = null;
        this.render();
      }
      if (action === "clear") {
        this.filters = defaultFilters();
        this.selectedId = null;
        this.restoreFilters();
        this.render();
        this.maps.fit();
      }
      if (action === "retry") await this.load();
      if (action === "fit") this.maps.fit();
      if (action === "export")
        this.app.dialogs.download(
          await this.api.export(this.filters),
          "amparo-community-demo.csv",
          "text/csv;charset=utf-8"
        );
      if (action === "markers" || action === "zones") {
        this.maps.setLayer(action);
        this.document.querySelectorAll(".community-map-layers button").forEach((button2) => {
          button2.classList.toggle(
            "selected",
            button2.dataset.communityAction === action
          );
          button2.setAttribute(
            "aria-pressed",
            String(button2.dataset.communityAction === action)
          );
        });
      }
      if (action === "street")
        this.document.querySelector('[data-community-action="street"]').setAttribute("aria-pressed", String(this.maps.toggleStreet()));
      if (action === "preview-alert") {
        const report = this.data?.reports.find(
          (item) => this.following.has(item.region)
        );
        if (report)
          this.openDialog("preview", alertPreview(report, this.language));
      }
    }
    reset() {
      this.closeDialog();
      this.lifecycle++;
      this.generation++;
      this.sending = false;
      this.requestId = null;
      this.api.reset?.();
      this.data = null;
      this.filters = defaultFilters();
      this.following.clear();
      this.selectedId = null;
      this.draft = {};
      this.reopen = null;
      this.tab = "map";
    }
    destroy() {
      this.news.detach();
      this.lifecycle++;
      this.generation++;
      this.submissionGeneration++;
      this.maps?.destroy();
    }
  };

  var AccountController = class {
    constructor(app) {
      this.app = app;
      this.service = app.options.account?.service;
      this.session = null;
      this.membership = null;
      this.mode = "signin";
      this.draft = {};
      this.generation = 0;
      this.setSession = (session, event) => {
        if (this.destroyed) return;
        this.captureForm();
        this.generation++;
        this.session = session;
        this.membership = null;
        if (!session) {
          this.mode = "signin";
          this.draft = {};
        } else if (event === "PASSWORD_RECOVERY") {
          this.mode = "update-password";
          this.draft = {};
          this.open();
        } else if (event === "SIGNED_IN") {
          this.draft = {};
        }
        this.render();

      };

      this.ready = this.initialize();
    }
    async initialize() {
      const generation = this.generation;

        const session = await this.service?.initialize();
        if (!this.destroyed && generation === this.generation)
          this.setSession(session || null);
      } catch {
        this.status = "failed";
        this.render();
      }
    }
    mount() {
      const document2 = this.app.document;
      for (const route of ["membership", "more"]) {
        const host = document2.querySelector(`section[data-screen="${route}"]`);
        if (!host || host.querySelector('[data-account-action="open"]')) continue;
        const button2 = document2.createElement("button");
        button2.className = "button quiet account-access-open";
        button2.type = "button";
        button2.dataset.accountAction = "open";
        button2.textContent = this.app.text(
          "Account & payment status",
          "Cuenta y estado del pago"
        );
        host.querySelector(".screen-heading, .section-heading")?.after(button2);
        if (!button2.isConnected) host.prepend(button2);
      }
      const dialog = document2.createElement("dialog");
      dialog.id = "account-access-dialog";
      dialog.setAttribute("aria-labelledby", "account-access-title");
      dialog.addEventListener("cancel", (event) => {
        event.preventDefault();
        this.close();
      });
      document2.body.append(dialog);
      this.render();
      if (this.isOpen) this.open();
    }
    captureForm() {
      const form2 = this.app.document.querySelector("#account-access-form");
      if (form2)
        this.draft = Object.fromEntries(new this.app.window.FormData(form2));
    }
    render() {
      const dialog = this.app.document.querySelector("#account-access-dialog");
      if (!dialog) return;
      const focused = dialog.contains(this.app.document.activeElement) ? this.app.document.activeElement.name : null;
      dialog.innerHTML = accountView(this);
      const form2 = dialog.querySelector("form");
      for (const [name, value] of Object.entries(this.draft)) {
        const field2 = form2?.elements.namedItem(name);
        if (field2) field2.value = value;
      }
      if (focused) form2?.elements.namedItem(focused)?.focus();
    }
    open() {
      if (!this.isOpen) this.opener = this.app.document.activeElement;
      this.isOpen = true;
      this.render();
      const dialog = this.app.document.querySelector("#account-access-dialog");
      if (dialog.showModal) dialog.showModal();
      else dialog.setAttribute("open", "");
      dialog.querySelector("input,button")?.focus();
    }
    close() {
      const dialog = this.app.document.querySelector("#account-access-dialog");
      if (dialog.close) dialog.close();
      else dialog.removeAttribute("open");
      this.isOpen = false;
      this.draft = {};
      this.render();
      this.opener?.isConnected && this.opener.focus();
    }
    async verify() {
      const generation = this.generation;
      this.membership = null;
      try {
        const result = await this.service.membership();
        if (generation !== this.generation || this.destroyed) return;
        if (typeof result.active !== "boolean" || result.mode !== "test")
          throw new Error("Invalid membership");
        this.membership = result;
        this.status = "";
      } catch {
        if (generation === this.generation) this.status = "verification";
      }
      this.render();
    }
    async submit(form2) {
      if (this.busy || !form2.reportValidity()) return;
      const values = Object.fromEntries(new this.app.window.FormData(form2));
      await this.run(async () => {
        if (this.mode === "recover") {
          await this.service.resetPassword(values.email);
          this.status = "recovery-email";
        } else if (this.mode === "update-password") {
          await this.service.updatePassword(values.password);
          this.draft = {};
          this.mode = "signin";
          this.status = "password-updated";
        } else if (values.mode === "signup") {
          const result = await this.service.signUp(values.email, values.password);
          if (!result.session) this.status = "email";
        } else await this.service.signIn(values.email, values.password);
      });
    }
    async run(operation) {
      if (this.busy) return;
      this.captureForm();
      this.busy = true;
      this.status = "";
      this.render();
      try {
        await operation();
      } catch {
        this.status = "failed";
      } finally {
        this.busy = false;
        if (!this.destroyed) this.render();
      }
    }
    async action(action) {
      if (action === "open") return this.open();
      if (action === "close") return this.close();
      if (this.busy) return;
      if (action === "recover" || action === "signin") {
        this.captureForm();
        this.draft = { email: this.draft.email || "" };
        this.mode = action;
        this.status = "";
        this.render();
        return;
      }
      if (action === "refresh") return this.refresh = this.verify();
      await this.run(async () => {
        if (action === "google" && this.service.googleEnabled)
          await this.service.signInGoogle();
        if (action === "signout") {
          await this.service.signOut();
          this.setSession(null);
        }
        if (action === "passkey" && this.service.passkeys)
          await this.service.signInPasskey();
        if (action === "register-passkey" && this.service.passkeys) {
          await this.service.registerPasskey();
          this.status = "passkey";
        }
        if (["checkout", "portal"].includes(action) && this.service.billingEnabled) {
          this.requestKey ||= this.app.window.crypto.randomUUID();
          const result = action === "checkout" ? await this.service.checkout(this.requestKey) : await this.service.portal();
          const url = new URL(result.url);
          const expected = action === "checkout" ? "checkout.stripe.com" : "billing.stripe.com";
          if (url.protocol !== "https:" || url.hostname !== expected || url.username || url.password)
            throw new Error("Invalid Stripe URL");
          this.app.window.location.assign(url.href);
        }
      });
    }
    destroy() {
      this.destroyed = true;
      this.generation++;
      this.unsubscribe?.();
    }
  };
