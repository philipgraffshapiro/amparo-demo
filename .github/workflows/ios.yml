name: iPhone app build and tests
on:
  workflow_dispatch:
  push:
    paths:
      - native/**
      - .github/workflows/ios.yml
permissions:
  contents: read
concurrency:
  group: amparo-ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 35
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: native/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run ios:prepare
      - run: gem install xcodeproj -v 1.27.0 --no-document
      - run: ruby tools/add-ios-tests.rb
      - run: node tools/run-ios-checks.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: amparo-iphone-build-${{ github.sha }}
          path: |
            native/artifacts/*.zip
            native/artifacts/*.xcresult
            native/artifacts/device.json
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: amparo-iphone-screenshots-${{ github.sha }}
          path: native/artifacts/screenshots/
          retention-days: 14
          if-no-files-found: error
